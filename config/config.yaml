# Solar PV Defect Detection & Health Assessment Configuration

project:
  name: "Solar_PV_Defect_Detection_Health_Assessment"
  version: "1.0.0"
  author: "CAT Advanced Machine Learning Lab"
  seed: 42

# dataset_mode: "synthetic" (default) or "elpv" (real Kaggle dataset)
dataset:
  dataset_mode: "elpv"       # Change to "elpv" after running prepare_elpv.py
  real_data_dir: "data/elpv"      # Path to ELPV dataset after prepare_elpv.py
  num_samples: 1000               # Only used for synthetic mode
  image_size: 64                  # 64 trains MUCH faster on CPU; increase to 128/224 with GPU
  num_classes: 4
  class_names:
    - "Healthy"
    - "Micro-Crack"
    - "Finger Interruption"
    - "Delamination"
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15

preprocessing:
  normalize: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  clahe_clip_limit: 2.0
  pca_components: 10
  tsne_perplexity: 30

model:
  cnn_backbone: "resnet18"        # resnet18 is fast; use resnet50 only with GPU
  pretrained: true
  num_epochs: 8                   # Reduced for CPU; increase to 20+ with GPU
  batch_size: 16                  # Smaller batch = faster per-step on CPU
  learning_rate: 0.001
  weight_decay: 0.0001
  dropout: 0.3
  device: "auto"

# HPO: Keep n_trials=3, hpo_epochs=1 for CPU. Increase with GPU.
hpo:
  n_trials: 3                     # 3 trials is enough for CPU; use 10+ with GPU
  hpo_epochs: 1                   # Epochs PER HPO trial (1 = fast evaluation)
  hpo_subset_frac: 0.4            # Use 40% of training data per HPO trial for speed
  timeout: 300
  lr_range: [0.00005, 0.005]
  batch_sizes: [16, 32, 64]
  optimizers: ["adam", "adamw", "sgd"]

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  models_dir: "static/models"
  visualizations_dir: "static/visualizations"
  report_output: "Solar_PV_Defect_Detection_Report.pdf"

api:
  host: "0.0.0.0"
  port: 8000

streamlit:
  port: 8501

